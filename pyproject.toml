[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panogrounder"
version = "0.1.0"
description = "VLM training, inference, and voting code for PanoGrounder"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Apache-2.0"}
authors = [{name = "PanoGrounder Authors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
train = [
  "SwissArmyTransformer==0.4.12",
  "deepspeed==0.16.7",
  "transformers==4.41.2",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "xformers==0.0.30",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "Pillow==11.2.1",
  "opencv-python==4.7.0.72",
  "einops==0.8.1",
  "jsonlines==4.0.0",
  "timm==1.0.15",
  "wandb==0.19.11",
]

[project.scripts]
panogrounder = "panogrounder.cli:main"

[tool.setuptools.packages.find]
include = ["panogrounder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
